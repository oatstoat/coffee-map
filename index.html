<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oat Milk Coffee Japan</title>

  <!-- MapLibre -->
  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <!-- Papa Parse: reads the CSV safely -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .maplibregl-popup-content {
      font-family: Arial, sans-serif;
      min-width: 180px;
    }

    .cafe-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .cafe-area {
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <script>

    // Create map
    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [137.8, 36.1],
      zoom: 6
    });


    // Zoom controls
    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );


    // User location control
    map.addControl(
      new maplibregl.GeolocateControl({
        positionOptions: {
          enableHighAccuracy: true
        },
        trackUserLocation: true,
        showUserHeading: true
      }),
      "top-right"
    );


    // Load cafe data from cafes.csv
    Papa.parse("cafes.csv?v=" + Date.now(), {

      download: true,

      header: true,

      skipEmptyLines: true,

      complete: function(results) {

        const cafes = results.data;

        console.log("Cafes loaded:", cafes);


        cafes.forEach(function(cafe) {

          const latitude = parseFloat(cafe["Latitude"]);
          const longitude = parseFloat(cafe["Longitude"]);

          // Ignore records without valid coordinates
          if (
            Number.isNaN(latitude) ||
            Number.isNaN(longitude)
          ) {
            return;
          }


          // Ignore records marked inactive
          const active = String(cafe["Active"] || "")
            .trim()
            .toLowerCase();

          if (
            active === "false" ||
            active === "no" ||
            active === "0"
          ) {
            return;
          }


          // Create popup
          const popup = new maplibregl.Popup({
            offset: 25
          }).setHTML(`
            <div class="cafe-name">
              ${cafe["Name"] || ""}
            </div>

            <div class="cafe-area">
              ${cafe["Neighbourhood"] || ""}
            </div>
          `);


          // Create marker
          new maplibregl.Marker()
            .setLngLat([
              longitude,
              latitude
            ])
            .setPopup(popup)
            .addTo(map);

        });

      },


      error: function(error) {

        console.error(
          "Could not load cafes.csv:",
          error
        );

      }

    });

  </script>

</body>
</html>
