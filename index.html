<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oat Milk Coffee Japan</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .maplibregl-popup-content {
      font-family: Arial, sans-serif;
      min-width: 200px;
    }

    .cafe-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .cafe-area {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .cafe-link {
      display: inline-block;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <script>
    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [137.8, 36.1],
      zoom: 6,
      fadeDuration: 0
    });

    // Force MapLibre to recalculate dimensions after iframe/layout changes.
    map.on("load", () => {
      map.resize();

      setTimeout(() => map.resize(), 250);
      setTimeout(() => map.resize(), 750);
      setTimeout(() => map.resize(), 1500);
      setTimeout(() => map.resize(), 3000);
    });

    window.addEventListener("resize", () => {
      map.resize();
    });

    // Watch for size changes caused by the Softr iframe/container.
    const resizeObserver = new ResizeObserver(() => {
      map.resize();
    });

    resizeObserver.observe(document.getElementById("map"));

    // Zoom/navigation controls.
    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );

    // User location control.
    map.addControl(
      new maplibregl.GeolocateControl({
        positionOptions: {
          enableHighAccuracy: true
        },
        trackUserLocation: true,
        showUserHeading: true
      }),
      "top-right"
    );

    // Load café data.
    Papa.parse("cafes.csv?v=" + Date.now(), {
      download: true,
      header: true,
      skipEmptyLines: true,

      complete: function(results) {
        const cafes = results.data;

        cafes.forEach(function(cafe) {
          const latitude = parseFloat(cafe["Latitude"]);
          const longitude = parseFloat(cafe["Longitude"]);

          if (
            Number.isNaN(latitude) ||
            Number.isNaN(longitude)
          ) {
            return;
          }

          const active = String(cafe["Active"] || "")
            .trim()
            .toLowerCase();

          if (
            active === "false" ||
            active === "no" ||
            active === "0"
          ) {
            return;
          }

          const recordId = cafe["Softr Record ID"];

          const detailUrl =
            "https://caterina5150.preview.softr.app/item-details?recordId=" +
            encodeURIComponent(recordId);

          const popup = new maplibregl.Popup({
            offset: 25
          }).setHTML(`
            <div class="cafe-name">
              ${cafe["Name"] || ""}
            </div>

            <div class="cafe-area">
              ${cafe["Neighbourhood"] || ""}
            </div>

            <a
              class="cafe-link"
              href="${detailUrl}"
              target="_top"
            >
              View café
            </a>
          `);

          new maplibregl.Marker()
            .setLngLat([
              longitude,
              latitude
            ])
            .setPopup(popup)
            .addTo(map);
        });

        // Resize again after markers are added.
        setTimeout(() => map.resize(), 100);
        setTimeout(() => map.resize(), 500);
        setTimeout(() => map.resize(), 1500);
      },

      error: function(error) {
        console.error(
          "Could not load cafes.csv:",
          error
        );
      }
    });
  </script>

</body>
</html>
